<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div class="popup">
            <div class="popup-header">
                <h2>CrOptix</h2>
                <span class="version-tag">v3.0.1</span>
            </div>

            <div class="calendar-section">
                <button id="openCalendarBtn" class="calendar-action-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11zm-7-9h5v5h-5z"/>
                    </svg>
                    <span>Abrir Calendário de Animes</span>
                </button>
            </div>

            <div class="divider"></div>

            <div class="settings-group">
                <label class="switch">
                    <input type="checkbox" id="toggleDesign" />
                    <span>Melhorias Visuais CrOptix</span>
                </label>
            </div>
        </div>
        <script src="popup.js"></script>
    </body>
</html>
