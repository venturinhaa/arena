<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div class="popup">
            <h2>CrOptix</h2>
            <label class="switch">
                <input type="checkbox" id="toggleDesign" />
                <span>Enable Design Changes</span>
            </label>
            <label class="switch">
                <input type="checkbox" id="toggleBlur" />
                <span>Blur Unwatched Episodes</span>
            </label>
            <label class="switch">
                <input type="checkbox" id="toggleFiller" />
                <span>Filler Tags &amp; Filters</span>
            </label>
            <label class="switch">
                <input type="checkbox" id="toggleCalendar" />
                <span>Release Calendar Button</span>
            </label>
            <p class="footer">v2.1.0</p>
        </div>
        <script src="popup.js"></script>
    </body>
</html>
